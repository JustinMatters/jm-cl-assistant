[project]
name = "jm-cl-assistant"
version = "0.1.0"
description = "Hybrid AI chatbot routing queries between a local Ollama model and Claude via the Anthropic API"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "asteval>=1.0.8",
    "chromadb>=1.5.5",
    "ddgs>=9.12.1",
    "diffusers>=0.37.1",
    "fastexcel>=0.19.0",
    "gradio~=6.10",
    "graphviz>=0.21",
    "kokoro-onnx~=0.5",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "ollama~=0.6",
    "openai~=2.30",
    "openai-whisper==20250625",
    "openpyxl>=3.1.5",
    "pint>=0.25.3",
    "polars>=1.39.3",
    "pypdf>=6.9.2",
    "python-docx>=1.2.0",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
    "torch>=2.11.0",
    "trafilatura>=1.4.0",
    "transformers>=5.5.3",
]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = ["integration: mark test as requiring live Ollama instance"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.8",
]
