[project]
name = "jm-cl-assistant"
version = "0.1.0"
description = "Hybrid AI chatbot routing queries between a local Ollama model and Claude via the Anthropic API"
requires-python = ">=3.13"
dependencies = [
    "gradio>=6.10.0",
    "kokoro-onnx>=0.5.0",
    "numpy>=2.4.3",
    "ollama>=0.6.1",
    "openai>=2.30.0",
    "openai-whisper>=20250625",
    "scipy>=1.17.1",
    "sounddevice>=0.5.5",
    "torch>=2.11.0",
]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
markers = ["integration: mark test as requiring live Ollama instance"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.8",
]
